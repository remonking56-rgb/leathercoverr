<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Leather Cover R | Official Website</title>
<meta name="description" content="Leather Cover R - حذاء جلد طبيعي ابيض كلاسيكي مع خمسة كفرات جلدية ملونة هدية. حذاء واحد واختيارات متعددة.">

<style>
:root {
  --bg:#090909;
  --panel:#141414;
  --gold:#c5a477;
  --gold-light:#e5cba4;
  --white:#f5f2ec;
  --muted:#aaa39a;
  --border:rgba(197,164,119,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--white);
  font-family:Tahoma,Arial,sans-serif;line-height:1.8
}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}

/* HEADER */
header{background:#090909;border-bottom:1px solid var(--border)}
.topbar{
  min-height:78px;display:flex;align-items:center;
  justify-content:space-between
}
.brand-logo{display:flex;align-items:center;max-width:160px}
.brand-logo img{
  display:block;width:auto;height:auto;max-width:150px;
  max-height:58px;object-fit:contain
}
.top-actions{display:flex;align-items:center;gap:22px}
.lang-btn{
  color:var(--gold);background:none;border:0;
  cursor:pointer;font-weight:bold;letter-spacing:1px
}
.menu-btn{
  width:40px;height:40px;border:1px solid var(--border);
  border-radius:4px;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px
}
.menu-btn span{width:19px;height:2px;background:var(--gold)}
.site-name{
  text-align:center;padding:5px 0 21px;color:var(--gold);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(25px,5vw,39px);font-weight:bold;
  letter-spacing:3px;line-height:1.4
}
nav{
  display:none;text-align:center;padding:13px;
  border-top:1px solid var(--border)
}
nav.open{display:block}
nav a{
  display:inline-block;margin:5px 13px;
  color:var(--muted);font-size:14px
}
nav a:hover{color:var(--gold)}

/* HERO */
.hero{
  padding:85px 0 75px;text-align:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(197,164,119,.12),transparent 60%),var(--bg)
}
.eyebrow{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:17px}
h1{
  max-width:850px;margin:0 auto 17px;
  font-size:clamp(32px,6vw,57px);line-height:1.4
}
h1 span{color:var(--gold)}
.hero-description{
  max-width:680px;margin:0 auto 25px;
  color:var(--muted);font-size:17px
}

/* INTERACTIVE INTERCHANGEABLE SHOWCASE */
.product-showcase {
  text-align:center;
  max-width:550px;
  margin:0 auto 35px;
  padding:20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
}
.shoe-display img {
  width:100%;
  max-width:380px;
  height:auto;
  border-radius:8px;
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.color-name {
  color:var(--gold);
  margin-top:12px;
  font-size:19px;
  font-weight:bold;
}
.color-selection p {
  color:var(--white);
  font-size:15px;
  margin:15px 0 12px;
}
.colors-grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  max-width:360px;
  margin:0 auto;
}
.color-dot {
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid #333;
  transition:all 0.2s ease;
}
.color-dot:hover, .color-dot.active {
  transform:scale(1.25);
  border-color:var(--gold-light);
  box-shadow:0 0 10px rgba(197, 164, 119, 0.8);
}

.gift-offer{
  max-width:650px;margin:28px auto 30px;padding:23px 18px;
  border:1px solid var(--gold);border-radius:5px;
  background:linear-gradient(135deg,#19150f,#100f0d);
  box-shadow:0 8px 35px rgba(197,164,119,.07)
}
.gift-label{
  display:inline-block;color:#111;background:var(--gold);
  padding:3px 17px;border-radius:20px;
  font-size:13px;font-weight:bold
}
.gift-offer h2{
  color:var(--gold-light);font-size:clamp(23px,4vw,31px);
  line-height:1.5;margin:12px 0 5px
}
.gift-offer p{color:var(--muted);margin:0;font-size:15px}
.gift-count{color:var(--gold);font-weight:bold}
.btn{
  display:inline-flex;justify-content:center;align-items:center;
  min-height:53px;padding:12px 34px;border:1px solid var(--gold);
  border-radius:3px;background:var(--gold);color:#111;
  font-weight:bold;cursor:pointer;transition:.2s
}
.btn:hover{background:var(--gold-light);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--gold);margin-inline-start:10px}
.btn-outline:hover{background:var(--gold);color:#111}

/* GENERAL SECTIONS */
section{padding:72px 0}
.section-title{text-align:center;margin-bottom:38px}
.section-title h2{
  color:var(--gold);font-size:clamp(25px,4vw,35px);margin:0 0 8px
}
.section-title p{color:var(--muted);margin:0}
.dark-section{
  background:#101010;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border)
}
.message{max-width:850px;margin:auto;text-align:center}
.message h2{color:var(--gold);font-size:clamp(27px,5vw,42px);margin:0 0 17px}
.message p{color:var(--muted);font-size:17px;margin:0 auto 15px}
.highlight{color:var(--gold-light)!important;font-weight:bold}

/* BENEFITS */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:5px;padding:28px 22px;text-align:center
}
.card-symbol{
  width:49px;height:49px;margin:0 auto 15px;
  display:grid;place-items:center;border:1px solid var(--gold);
  border-radius:50%;color:var(--gold);font-size:23px
}
.card h3{color:var(--gold-light);margin:0 0 9px;font-size:19px}
.card p{color:var(--muted);margin:0;font-size:14px}

/* COLORS */
.color-list{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:20px;margin-top:28px
}
.color-item{
  display:flex;flex-direction:column;align-items:center;
  gap:9px;color:var(--muted);font-size:13px
}
.swatch{
  width:44px;height:44px;border-radius:50%;
  border:2px solid #777;box-shadow:0 0 0 3px #191919
}

/* ORDER */
.order-box{
  max-width:700px;margin:auto;padding:30px;
  background:var(--panel);border:1px solid var(--border);border-radius:5px
}
.order-gift{
  text-align:center;padding:15px;margin-bottom:23px;
  border:1px solid var(--border);background:#100f0d
}
.order-gift strong{display:block;color:var(--gold-light);font-size:20px}
.order-gift span{color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{color:var(--gold-light);font-size:14px}
.field input,.field select{
  width:100%;min-height:48px;padding:10px 12px;
  background:#0b0b0b;color:var(--white);
  border:1px solid #40392f;border-radius:3px;outline:none
}
.field input:focus,.field select:focus{border-color:var(--gold)}
.order-box .btn{width:100%;margin-top:24px;font-size:17px}
.form-note{color:var(--muted);font-size:12px;text-align:center;margin:14px 0 0}
#orderResult{
  display:none;margin-top:20px;padding:18px;
  border:1px solid var(--gold);background:#17140f;
  color:var(--white);white-space:pre-line;font-size:14px
}

/* FOOTER */
footer{
  padding:27px 0;text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);font-size:13px
}
footer p{margin:4px 0}

/* MOBILE */
@media(max-width:700px){
  .wrap{width:calc(100% - 30px)}
  .hero{padding:65px 0 58px}
  section{padding:55px 0}
  .cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .order-box{padding:21px 16px}
  .hero .btn{width:min(100%,280px);margin:6px auto}
  .btn-outline{margin-inline-start:0}
  .brand-logo img{max-width:125px;max-height:52px}
  .top-actions{gap:15px}
}
</style>
</head>
